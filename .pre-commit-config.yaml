ci:
  autoupdate_schedule: monthly

default_language_version:
  python: python3.14

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-json
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-toml
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/crate-ci/typos
  rev: 36e31b0923b6cebbbed30598877a994b2dd56df8  # frozen: v1
  hooks:
  - id: typos
    exclude: |
      (?x)^(
        .*\.svg
      )$
- repo: https://github.com/tox-dev/pyproject-fmt
  rev: a007bb7dd9043d022292401abc3061cb1906b4bc  # frozen: v2.21.2
  hooks:
  - id: pyproject-fmt
- repo: https://github.com/adamchainz/django-upgrade
  rev: 4864562a5d05a7ff3bce99bc31f892eeb396fc00  # frozen: 1.30.0
  hooks:
  - id: django-upgrade
- repo: https://github.com/adamchainz/blacken-docs
  rev: dda8db18cfc68df532abf33b185ecd12d5b7b326  # frozen: 1.20.0
  hooks:
  - id: blacken-docs
    additional_dependencies:
    - black==25.1.0
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 0c7b6c989466a93942def1f84baf36ddfcd60c83  # frozen: v0.15.14
  hooks:
    - id: ruff-check
      args: [ --fix ]
    - id: ruff-format
