ci:
  autoupdate_schedule: monthly

default_language_version:
  python: python3.14

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-json
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-toml
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/crate-ci/typos
  rev: a90d2a917d59472bef788897931c1a5a5d12870a  # frozen: v1
  hooks:
  - id: typos
    exclude: |
      (?x)^(
        .*\.svg
      )$
- repo: https://github.com/tox-dev/pyproject-fmt
  rev: 91de51aef61c5f2383f03da25604e3d65a8309e0  # frozen: v2.21.1
  hooks:
  - id: pyproject-fmt
- repo: https://github.com/adamchainz/django-upgrade
  rev: 4864562a5d05a7ff3bce99bc31f892eeb396fc00  # frozen: 1.30.0
  hooks:
  - id: django-upgrade
- repo: https://github.com/adamchainz/blacken-docs
  rev: dda8db18cfc68df532abf33b185ecd12d5b7b326  # frozen: 1.20.0
  hooks:
  - id: blacken-docs
    additional_dependencies:
    - black==25.1.0
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 6fec9b7edb08fd9989088709d864a7826dc74e80  # frozen: v0.15.12
  hooks:
    - id: ruff-check
      args: [ --fix ]
    - id: ruff-format
