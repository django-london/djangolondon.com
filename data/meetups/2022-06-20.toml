[[talks]]
title = "Patterns of flakey Python tests"
description = "Flakey tests are those that fail intermittently - they are annoying and affect all large test suites. This talk will describe some common causes of flakiness in Python tests, and include advice on fixing and preventing flakey tests."

speakers = ["david-winterbottom"]
