[[talks]]
title = "Supercharge Django with Mau Markup"
description = "This talk introduces the audience to the Mau markup language and shows how it can be easily used in a Django website to greatly improve the rendering of text fields. The talks doesn't requires specific knowledge of Django or of markup languages in general, even though a familiarity with Markdown might be beneficial."

