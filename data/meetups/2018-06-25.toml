[[talks]]
title = "10 Lessons From 10 Years of Selling Dev Work"
description = "Matthew will share 10 key lessons learnt on his journey, told from the perspective of a developer. You'll hear actionable tips and insight you can act on today, whether you're a freelancer, contractor or employee."

