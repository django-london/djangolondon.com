[[talks]]
title = "pip install disaster-waiting-to-happen"
description = "Open source packages and libraries save us time, money and some much needed sanity. But with every new dependency comes the chance you’re letting in more than you bargained for. We’ll take a look at the tools and techniques you can use today to make sure you’re not the one responsible for introducing a game ending security vulnerability."

speakers = ["lili-kastilio"]
