[[talks]]
title = "Introspection and Reflection In Python"
description = "Introspection/reflection allows us to gain a great deal of flexibility and control when building our program. In Python, we get the introspection feature out of the box. This talk will explore various builtin python functions and modules that fall under the category of introspection, including live demonstrations of use cases."

[talks.speaker]
name = "Luna Chen"

[[talks]]
title = "Better transactional emails"
description = "As web application creators we are generally pretty confident in sending transactional emails, but how can you get more value from them? Sure, you can include some tracking ability to get read counts and link clicks, but what about going one step further and being able to handle replies to your transactional emails? In this talk you will hear about how I approached this problem. Some techniques for identifying and tracking your transactional emails and being able to deal with the sometimes crazy word of email clients and content formats. Even if you don’t plan on including incoming email processing in your apps, you should learn a bit more about how email works and some techniques you can employ in your web applications."

[talks.speaker]
name = "Christopher McDonald"
