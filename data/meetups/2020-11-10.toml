[[talks]]
title = "Serverless Data Tasks with Python and Hark"
description = "This talk is about [Hark Lang](https://github.com/condense9/hark-lang) - a new way to think about computation on serverless infrastructure. Hark is a language for building programs that run Python in a virtual machine on cloud functions. Prior knowledge of serverless concepts will help, but isn't essential."

speakers = ["ric-da-silva"]
