[[talks]]
title = "Using the Django JSONField for various calculations"
description = "In this talk, Vlad Podgurschi will cover the effective use of Django's JSONField for various calculations. Attendees will learn how to utilize KeyTextTransforms and the upcoming KT expression, as well as how to annotate and aggregate on JSONField paths. Through the lens of a real-world example, Vlad will demonstrate how Django's JSONField was leveraged to achieve a particular goal. Those with experience in querysets will be able to easily follow along."

[talks.speaker]
name = "Vlad Podgurschi"
