[[talks]]
title = "The coding conventions that make our lives easier"
description = "Engineers review code as often as they write it and use a lot of tools to improve this process, such as linters and auto-formatters. One tool that is also very useful is the coding conventions. It is a collection of references that can be used during code-reviews, whilst also serving as a valuable day to day reference and guide for all team. This talk will explore several different conventions from open source conventions repo, offering an in-depth exploration of how they improve the quality of the codebase and serve as a tool for knowledge transfer among engineering teams. The structure of the talk will follow: What are coding conventions and why do we use them? How to establish your own coding conventions? Examples of some of the most useful coding conventions and how they enhance code quality. How to uphold your coding conventions with the help of linters? Attendees will leave with a comprehensive understanding of the concept coding conventions and how to implement them within their own team."

speakers = ["cagl-ulusahin-sonmez"]

[[talks]]
title = "Committing 1 trillion lines of code to Github, and other fun things to do over the weekend"
description = "This talk covers a side project I’ve been working on to commit every line of code published to PyPI into GitHub. I’ll go over the specifics of how this was done, what this enables and most importantly why I did this. I'll also talk a bit about what makes a good side project and how you can find interesting side projects that motivate you."

speakers = ["tom-forbes"]
