# fly.toml app configuration file generated for djangolondon-com on 2026-05-23T21:54:32Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'djangolondon-com'
primary_region = 'lhr'
console_command = '/code/manage.py shell'

[build]

[env]
  DATABASE_PATH = '/mnt/djangolondon/djangolondon.sqlite3'
  HTTPS = "1"
  PORT = '8000'

[[mounts]]
  source = 'djangolondon'
  destination = '/mnt/djangolondon'
  snapshot_retention = 14

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[[statics]]
  guest_path = '/app/static_root'
  url_prefix = '/static/'
