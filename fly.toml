# https://fly.io/docs/reference/configuration/

app = "djangolondon"
primary_region = "lhr"
console_command = "/app/manage.py shell"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[statics]]
  guest_path = "/app/static_root"
  url_prefix = "/s/"

[mounts]
  source = "djangolondon"
  destination = "/mnt/djangolondon"
