[project]
name = "djangolondon.com"
version = "0"
requires-python = ">=3.14,<3.15"
description = "The website for Django London, the Django meetup in London, UK."
dependencies = [
    "dj-lite>=1.3.0",
    "django",
    "django-browser-reload",
    "gunicorn",
    "markdown-it-py>=4.2.0",
]

[dependency-groups]
dev = [
    "coverage>=7.14.0",
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
]

[tool.pytest]
ini_options.DJANGO_SETTINGS_MODULE = "djangolondon.settings"

[tool.coverage]
run.branch = true
run.data_file = ".coverage/cov"
run.source = [
  "djangolondon",
]
report.show_missing = true
report.skip_covered = true
report.skip_empty = true
