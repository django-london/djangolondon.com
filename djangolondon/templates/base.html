{% load static %}
<!DOCTYPE html>
<html lang=en>

<head>
  <meta charset=UTF-8>

  <title>{% if title %}{{ title }} | {% endif %}Django London</title>

  <meta name=viewport content="width=device-width, initial-scale=1">

  <link rel=stylesheet href="{% static 'style.css' %}">
</head>

<body>

<header class=flow>
  <div class=inner>
    <h1><a href=/>Django London</a></h1>
    <p>We meet monthly to discuss Django, Python, the web, and related topics.</p>
  </div>
</header>

<nav>
  <div class=inner>
    <a href=/>Home</a>
    <a href=/meetups/>Meetups</a>
    <a href=/speakers/>Speakers</a>
    <a href=/quizzes/>Quizzes</a>
    <a href=/code-of-conduct/>Code of Conduct</a>
  </div>
</nav>

<main class=flow>
{% block main %}{% endblock %}
</main>

</body>
</html>
