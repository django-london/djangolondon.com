{% load static %}
<!DOCTYPE html>
<html lang=en>

<head>
  <meta charset=UTF-8>

  <title>{% if title %}{{ title }} | {% endif %}Django London</title>

  <meta name=viewport content="width=device-width, initial-scale=1">

  <link rel=stylesheet href="{% static 'style.css' %}">
</head>

<body hx-ext=morph>

<header class=flow>
  <div class=inner>
    <h1><a href=/>Django London</a></h1>
    <p>We meet monthly to discuss Django, Python, the web, and related topics.</p>
  </div>
</header>
<main class=flow>
{% block main %}{% endblock %}
</main>

</body>
</html>
